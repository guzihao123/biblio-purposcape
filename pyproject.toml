[project]
name = "purpose-landscape-web"
version = "0.1.0"
description = "Public literature-research web agent"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<1.0",
    "cairosvg>=2.7,<3.0",
    "itsdangerous>=2.2,<3.0",
    "openai>=1.0,<3.0",
    "onnxruntime>=1.17,<2.0",
    "Pillow>=10.0,<12.0",
    "pypdfium2>=4.30,<5.0",
    "python-docx>=1.1,<2.0",
    "python-pptx>=1.0,<2.0",
    "rapidocr>=3.0,<4.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "pydantic-settings>=2.0,<3.0",
    "redis>=5.0,<7.0",
    "rq>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "fakeredis>=2.20,<3.0",
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
