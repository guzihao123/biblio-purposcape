services:
  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/tasks.db
      ARTIFACT_ROOT: /data/artifacts
      REDIS_URL: redis://redis:6379/0
    volumes:
      - landscape-data:/data
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    command: python worker.py
    environment:
      DATABASE_URL: sqlite:////data/tasks.db
      ARTIFACT_ROOT: /data/artifacts
      REDIS_URL: redis://redis:6379/0
    volumes:
      - landscape-data:/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    volumes:
      - landscape-redis:/data

volumes:
  landscape-data:
  landscape-redis:
